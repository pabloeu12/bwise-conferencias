[theme]
# Paleta Premium (Estilo Tailwind CSS)
primaryColor = "#1E3A8A"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
font = "sans serif"

[client]
# Remove o menu de hambúrguer do topo
toolbarMode = "minimal"
# O menu dos módulos é renderizado explicitamente em core/ui.py
showSidebarNavigation = false
